<!-- LoanIQ Frontend -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoanIQ</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>LoanIQ</h1>

        <p>AI-Powered Loan Approval Prediction</p>

        <form id="loanForm">

            <!-- Applicant Information -->

            <h2>Applicant Information</h2>

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >

            <input
                type="number"
                id="annualIncome"
                placeholder="Annual Income"
                required
            >

            <input
                type="number"
                id="creditScore"
                placeholder="Credit Score"
                required
            >

            <select id="employmentStatus" required>
                <option value="">Employment Status</option>
                <option value="Employed">Employed</option>
                <option value="Self-Employed">Self-Employed</option>
                <option value="Unemployed">Unemployed</option>
            </select>

            <select id="educationLevel" required>
                <option value="">Education Level</option>
                <option value="High School">High School</option>
                <option value="Associate">Associate</option>
                <option value="Bachelor">Bachelor</option>
                <option value="Master">Master</option>
                <option value="Doctorate">Doctorate</option>
            </select>


            <!-- Loan Information -->

            <h2>Loan Information</h2>

            <input
                type="number"
                id="loanAmount"
                placeholder="Loan Amount"
                required
            >

            <input
                type="number"
                id="loanDuration"
                placeholder="Loan Duration (months)"
                required
            >

            <select id="maritalStatus" required>
                <option value="">Marital Status</option>
                <option value="Single">Single</option>
                <option value="Married">Married</option>
                <option value="Divorced">Divorced</option>
                <option value="Widowed">Widowed</option>
            </select>

            <input
                type="number"
                id="dependents"
                placeholder="Number of Dependents"
                required
            >

            <select id="homeOwnership" required>
                <option value="">Home Ownership</option>
                <option value="Own">Own</option>
                <option value="Mortgage">Mortgage</option>
                <option value="Rent">Rent</option>
                <option value="Other">Other</option>
            </select>


            <!-- Financial Information -->

            <h2>Financial Information</h2>

            <input
                type="number"
                id="monthlyDebt"
                placeholder="Monthly Debt Payments"
                required
            >

            <input
                type="number"
                step="0.001"
                id="dti"
                placeholder="Debt-to-Income Ratio"
                required
            >

            <select id="bankruptcy" required>
                <option value="">Bankruptcy History</option>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>

            <select id="previousDefaults" required>
                <option value="">Previous Loan Defaults</option>
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>

            <input
                type="number"
                id="paymentHistory"
                placeholder="Payment History"
                required
            >

            <button type="submit">
                Predict Loan Approval
            </button>

        </form>
        <!-- Sample Applicant Data -->

<section class="sample-section">

    <h2>Try Sample Applicants</h2>

    <p>Select a sample applicant to automatically fill the form.</p>

    <div class="sample-buttons">

        <button type="button" class="sample-btn" onclick="loadSample(0)">
            Sample 1 - Strong Applicant
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(1)">
            Sample 2 - High Income
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(2)">
            Sample 3 - Low Credit
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(3)">
            Sample 4 - High Debt
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(4)">
            Sample 5 - Young Applicant
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(5)">
            Sample 6 - Experienced
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(6)">
            Sample 7 - Risky Applicant
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(7)">
            Sample 8 - Moderate Applicant
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(8)">
            Sample 9 - Excellent Credit
        </button>

        <button type="button" class="sample-btn" onclick="loadSample(9)">
            Sample 10 - High Loan
        </button>

    </div>

</section>


        <!-- Prediction Result -->

        <!-- Prediction Result -->

<div id="result" class="result-card">

    <div id="resultIcon" class="result-icon"></div>

    <h2 id="resultTitle"></h2>

    <p id="resultProbability"></p>

    <div class="probability-container">

        <div class="probability-bar">
            <div id="probabilityFill"></div>
        </div>

    </div>

    <p id="resultMessage"></p>

    <button
        type="button"
        id="resetButton"
        onclick="resetForm()"
    >
        Try Another Application
    </button>

</div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
