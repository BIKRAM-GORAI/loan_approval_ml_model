<!-- LoanIQ Frontend -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanIQ - AI-Powered Loan Approval Prediction</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>LoanIQ</h1>
        <p>AI-Powered Loan Approval Prediction System</p>

        <form id="loanForm">

            <!-- Applicant Information -->
            <h2>Applicant Information</h2>

            <div class="form-group">
                <label for="age">Age (years)</label>
                <input
                    type="number"
                    id="age"
                    placeholder="e.g. 35"
                    min="18"
                    max="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="annualIncome">Annual Income ($)</label>
                <input
                    type="number"
                    id="annualIncome"
                    placeholder="e.g. 75000"
                    min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="creditScore">Credit Score (300 - 850)</label>
                <input
                    type="number"
                    id="creditScore"
                    placeholder="e.g. 720"
                    min="300"
                    max="850"
                    required
                >
            </div>

            <div class="form-group">
                <label for="employmentStatus">Employment Status</label>
                <select id="employmentStatus" required>
                    <option value="">Select Employment Status</option>
                    <option value="Employed">Employed</option>
                    <option value="Self-Employed">Self-Employed</option>
                    <option value="Unemployed">Unemployed</option>
                </select>
            </div>

            <div class="form-group">
                <label for="educationLevel">Education Level</label>
                <select id="educationLevel" required>
                    <option value="">Select Education Level</option>
                    <option value="High School">High School</option>
                    <option value="Associate">Associate</option>
                    <option value="Bachelor">Bachelor</option>
                    <option value="Master">Master</option>
                    <option value="Doctorate">Doctorate</option>
                </select>
            </div>


            <!-- Loan Information -->
            <h2>Loan Information</h2>

            <div class="form-group">
                <label for="loanAmount">Requested Loan Amount ($)</label>
                <input
                    type="number"
                    id="loanAmount"
                    placeholder="e.g. 25000"
                    min="500"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loanDuration">Loan Duration (months)</label>
                <input
                    type="number"
                    id="loanDuration"
                    placeholder="e.g. 36"
                    min="6"
                    max="360"
                    required
                >
            </div>

            <div class="form-group">
                <label for="maritalStatus">Marital Status</label>
                <select id="maritalStatus" required>
                    <option value="">Select Marital Status</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Divorced">Divorced</option>
                    <option value="Widowed">Widowed</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dependents">Number of Dependents</label>
                <input
                    type="number"
                    id="dependents"
                    placeholder="e.g. 1"
                    min="0"
                    max="20"
                    required
                >
            </div>

            <div class="form-group">
                <label for="homeOwnership">Home Ownership Status</label>
                <select id="homeOwnership" required>
                    <option value="">Select Home Ownership</option>
                    <option value="Own">Own</option>
                    <option value="Mortgage">Mortgage</option>
                    <option value="Rent">Rent</option>
                    <option value="Other">Other</option>
                </select>
            </div>


            <!-- Financial Information -->
            <h2>Financial Information</h2>

            <div class="form-group">
                <label for="monthlyDebt">Monthly Debt Payments ($)</label>
                <input
                    type="number"
                    id="monthlyDebt"
                    placeholder="e.g. 450"
                    min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="dti">Debt-to-Income (DTI) Ratio</label>
                <input
                    type="number"
                    step="0.001"
                    id="dti"
                    placeholder="e.g. 0.25"
                    min="0"
                    max="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="bankruptcy">Bankruptcy History</label>
                <select id="bankruptcy" required>
                    <option value="">Any Past Bankruptcy?</option>
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="previousDefaults">Previous Loan Defaults</label>
                <select id="previousDefaults" required>
                    <option value="">Any Previous Defaults?</option>
                    <option value="0">No (0)</option>
                    <option value="1">Yes (1)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentHistory">Payment History Score</label>
                <input
                    type="number"
                    id="paymentHistory"
                    placeholder="e.g. 28"
                    min="0"
                    required
                >
            </div>

            <button type="submit">
                Predict Loan Approval
            </button>

        </form>

        <!-- Sample Applicant Data -->
        <section class="sample-section">
            <h2>Try Sample Applicants</h2>
            <p>Select a pre-configured applicant profile to test predictions instantly.</p>

            <div class="sample-buttons">
                <button type="button" class="sample-btn" onclick="loadSample(0)">
                    Sample 1 - Strong Applicant
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(1)">
                    Sample 2 - High Income
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(2)">
                    Sample 3 - Low Credit
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(3)">
                    Sample 4 - High Debt
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(4)">
                    Sample 5 - Young Applicant
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(5)">
                    Sample 6 - Experienced
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(6)">
                    Sample 7 - Risky Applicant
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(7)">
                    Sample 8 - Moderate Applicant
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(8)">
                    Sample 9 - Excellent Credit
                </button>
                <button type="button" class="sample-btn" onclick="loadSample(9)">
                    Sample 10 - High Loan
                </button>
            </div>
        </section>

        <!-- Prediction Result Card -->
        <div id="result" class="result-card"></div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
